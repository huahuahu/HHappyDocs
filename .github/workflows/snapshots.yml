name: iOS snapshots

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshots-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: List snapshots (${{ matrix.device }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone
            model: iPhone-17-Pro
            ios: "27.0"
            build: "24A434"
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-27-0
          - device: iphone-duo
            model: iPhone-Duo
            ios: "27.1"
            build: "24A94401"
            runtime: com.apple.CoreSimulator.SimRuntime.iOS-27-1
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SNAPSHOT_RUNTIME_ID: ${{ matrix.runtime }}
      SNAPSHOT_RUNTIME_BUILD: ${{ matrix.build }}
      # TEST_RUNNER_ forwards these values to the simulator test process.
      TEST_RUNNER_HDIARY_RECORD_SNAPSHOTS: "0"
      TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/SnapshotResults/Images
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned XcodeGen
        run: ./scripts/install-xcodegen.sh

      - name: Generate Xcode project and restore dependency lock
        run: ./scripts/generate-project.sh

      - name: Verify snapshot environment
        id: snapshot-environment
        run: |
          set -o pipefail
          mkdir -p SnapshotResults
          xcodebuild -version | tee SnapshotResults/xcode-version.txt
          # 固定公开版本；具体 build 只用于记录和缓存隔离，不作为通过条件。
          snapshot_xcode_version="$(awk '/^Xcode / {print $2}' SnapshotResults/xcode-version.txt)"
          test "$snapshot_xcode_version" = '27.1'
          snapshot_xcode_build="$(awk '/^Build version / {print $3}' SnapshotResults/xcode-version.txt)"
          printf 'xcode-build=%s\n' "$snapshot_xcode_build" >> "$GITHUB_OUTPUT"
          swift --version
          xcrun simctl list devices available
          xcrun simctl list runtimes --json | python3 -c '
          import json, os, sys
          available = any(r["identifier"] == os.environ["SNAPSHOT_RUNTIME_ID"] and r["buildversion"] == os.environ["SNAPSHOT_RUNTIME_BUILD"]
                          and r["isAvailable"]
                          for r in json.load(sys.stdin)["runtimes"])
          print(f"runtime-installed={str(available).lower()}")
          ' >> "$GITHUB_OUTPUT"

      - name: Cache iOS ${{ matrix.ios }} runtime download
        if: steps.snapshot-environment.outputs.runtime-installed != 'true'
        uses: actions/cache@v5
        with:
          path: SimulatorRuntimeDownloads
          key: snapshot-runtime-ios-${{ matrix.ios }}-${{ matrix.build }}-arm64

      - name: Prepare snapshot simulator
        run: |
          if [ '${{ steps.snapshot-environment.outputs.runtime-installed }}' != 'true' ]; then
            mkdir -p SimulatorRuntimeDownloads
            # 新版 runtime 的 exportedBundle 包含导入元数据，不能选择其内部 Restore/*.dmg。
            runtime_package="$(find SimulatorRuntimeDownloads -maxdepth 1 \( -name '*.exportedBundle' -o -name '*.dmg' \) -print -quit)"
            if [ -z "$runtime_package" ]; then
              xcodebuild -downloadPlatform iOS -buildVersion "$SNAPSHOT_RUNTIME_BUILD" \
                -architectureVariant arm64 -exportPath SimulatorRuntimeDownloads
              runtime_package="$(find SimulatorRuntimeDownloads -maxdepth 1 \( -name '*.exportedBundle' -o -name '*.dmg' \) -print -quit)"
            fi
            test -n "$runtime_package"
            xcodebuild -importPlatform "$runtime_package"
          fi

          # 同一 iOS 版本的不同 build 也可能改变系统 List 布局，必须与基准一致。
          xcrun simctl list runtimes --json | python3 -c '
          import json, os, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          assert any(r["identifier"] == os.environ["SNAPSHOT_RUNTIME_ID"]
                     and r["buildversion"] == os.environ["SNAPSHOT_RUNTIME_BUILD"]
                     and r["isAvailable"] for r in runtimes), runtimes
          '

          # 使用指定型号和 runtime 新建设备，隔离每次测试的 App 数据和设置。
          # 创建和启动分开记录，避免将模拟器启动等待误认为截图测试卡住。
          snapshot_simulator_id="$(xcrun simctl create 'Snapshot ${{ matrix.device }}' \
            'com.apple.CoreSimulator.SimDeviceType.${{ matrix.model }}' \
            "$SNAPSHOT_RUNTIME_ID")"

          # 将 UUID 传给后续 Actions 步骤，确保截图测试选择这台新设备。
          echo "SNAPSHOT_SIMULATOR_ID=$snapshot_simulator_id" >> "$GITHUB_ENV"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v5
        with:
          path: DerivedData/Snapshots/SourcePackages
          key: snapshots-swiftpm-${{ steps.snapshot-environment.outputs.xcode-build }}-${{ hashFiles('Package.resolved', 'HDiaryLibrary/Package.swift', 'HSharedCode/Package.swift') }}

      - name: Build snapshot tests
        timeout-minutes: 14
        run: |
          python3 scripts/ci-snapshot-phase.py build 720 \
            xcodebuild build-for-testing \
            -project HDiary.xcodeproj \
            -scheme HDiarySnapshotHost \
            -configuration Debug \
            -testPlan HDiarySnapshots \
            -destination "platform=iOS Simulator,id=$SNAPSHOT_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath DerivedData/Snapshots \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot snapshot simulator
        timeout-minutes: 7
        run: |
          # 保持先编译再启动的顺序，避免模拟器的首次启动与编译争用 runner 资源。
          python3 scripts/ci-snapshot-phase.py boot 300 \
            xcrun simctl bootstatus "$SNAPSHOT_SIMULATOR_ID" -b

      - name: Run snapshot tests
        timeout-minutes: 23
        run: |
          # 在 job 的 45 分钟上限前终止异常等待，为诊断和 artifact 上传留出时间。
          python3 scripts/ci-snapshot-phase.py test 1200 \
            xcodebuild test-without-building \
            -project HDiary.xcodeproj \
            -scheme HDiarySnapshotHost \
            -configuration Debug \
            -testPlan HDiarySnapshots \
            -destination "platform=iOS Simulator,id=$SNAPSHOT_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics on-failure \
            -onlyUsePackageVersionsFromResolvedFile \
            -derivedDataPath DerivedData/Snapshots \
            -resultBundlePath SnapshotResults/Lists.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Collect simulator logs on failure
        if: ${{ failure() && env.SNAPSHOT_SIMULATOR_ID != '' }}
        timeout-minutes: 2
        run: |
          python3 scripts/ci-snapshot-phase.py simulator-log 60 \
            xcrun simctl spawn "$SNAPSHOT_SIMULATOR_ID" log show \
            --last 30m --style compact \
            --predicate 'process == "testmanagerd" OR process == "HDiarySnapshotHost" OR process == "xctest" OR process == "runningboardd"'

      - name: Stop snapshot simulator
        if: ${{ always() && env.SNAPSHOT_SIMULATOR_ID != '' }}
        timeout-minutes: 2
        continue-on-error: true
        # 测试和诊断结束后释放模拟器资源，避免后台系统进程继续拖慢结果导出和上传。
        run: xcrun simctl shutdown "$SNAPSHOT_SIMULATOR_ID"

      - name: Export screenshot attachments
        if: ${{ always() }}
        timeout-minutes: 2
        # 辅助导出失败时仍上传原始 xcresult；测试步骤和结果上传继续决定 job 是否失败。
        continue-on-error: true
        run: |
          if [ -d SnapshotResults/Lists.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path SnapshotResults/Lists.xcresult \
              --output-path SnapshotResults/Attachments
          fi

      - name: Upload snapshot results
        if: ${{ always() }}
        timeout-minutes: 15
        uses: actions/upload-artifact@v6
        with:
          name: list-snapshots-${{ matrix.device }}
          path: SnapshotResults/
          if-no-files-found: warn
          retention-days: 14
