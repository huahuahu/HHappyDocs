name: iOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and test HDiary
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify Xcode 27.1
        run: |
          xcodebuild -version
          ci_xcode_version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          test "$ci_xcode_version" = '27.1'
          swift --version
          xcrun simctl list devices available

      - name: Prepare test simulator
        run: |
          ci_simulator_id="$(xcrun simctl create 'CI iPhone 17 Pro' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro)"
          echo "CI_SIMULATOR_ID=$ci_simulator_id" >> "$GITHUB_ENV"

      - name: Build HDiary
        run: |
          xcodebuild \
            -project HDiary.xcodeproj \
            -scheme HDiary \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$CI_SIMULATOR_ID" \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Test HDiary
        run: |
          xcodebuild \
            clean \
            test \
            -project HDiary.xcodeproj \
            -scheme HDiary \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$CI_SIMULATOR_ID" \
            CODE_SIGN_IDENTITY="-"
